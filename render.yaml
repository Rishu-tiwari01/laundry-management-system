databases:
  - name: laundry-db
    plan: free
    databaseName: laundry
    user: laundry

services:
  - type: web
    name: laundry-management-system
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn laundry_project.wsgi
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: laundry-db
          property: connectionString
